version: '3.8'

services:
  postgres:
    image: postgres:17 # Mudou de 15 para 17
    container_name: lib_db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lib_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lib_db_redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data:
    driver: local
